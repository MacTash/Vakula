[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoscope"
version = "0.2.0"
description = "Terminal-native multi-source situational awareness workspace"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "platformdirs>=4.3",
    "textual>=8.0",
    "textual-image[textual]>=0.14",
    "av>=19",
    "Pillow>=10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geoscope = "geoscope.cli:main"

[tool.setuptools.package-data]
geoscope = ["*.tcss"]

[tool.setuptools.packages.find]
include = ["geoscope*"]
