[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The import package, CLI, data file and GitHub repo are all plain "vidur".
# Publishing note: PyPI "vidur" is held by Georgia Tech / Microsoft (an LLM
# inference cluster simulator), so a future PyPI release must ship under a
# distinct slug — vidur-scope is free on both PyPI and npm — or install from
# git. npm "vidur" itself is unclaimed, so the launcher needs no scope.
name = "vidur"
version = "0.2.0"
description = "Terminal-native geopolitical situational awareness and intelligence workspace"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "platformdirs>=4.3",
    "textual>=8.0",
    "textual-image[textual]>=0.14",
    "av>=19",
    "Pillow>=10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vidur = "vidur.cli:main"

[tool.setuptools.package-data]
vidur = ["*.tcss"]

[tool.setuptools.packages.find]
include = ["vidur*"]
