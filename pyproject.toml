[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The import package, CLI, data file, GitHub repo, PyPI name and npm name are
# all plain "vakula". Earlier releases shipped as Geoscope and then Vidur; both
# prefixes and both database filenames stay honoured so an existing install
# keeps its data. See vakula/storage.py -> LEGACY_APP_NAMES.
name = "vakula"
version = "0.4.0"
# Permissive, with an express patent grant: the fusion scoring, confidence
# separation and forecast significance test are the novel parts worth protecting.
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Terminal-native geopolitical situational awareness and intelligence workspace"
# Without this the PyPI project page renders with no description at all.
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "platformdirs>=4.3",
    "textual>=8.0",
    "textual-image[textual]>=0.14",
    "av>=19",
    "Pillow>=10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vakula = "vakula.cli:main"

[tool.setuptools.package-data]
vakula = ["*.tcss"]

[tool.setuptools.packages.find]
include = ["vakula*"]
